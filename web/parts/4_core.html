      show.forEach(function (j, li) {
        var yy = top + li * lane + lane / 2; var lt = U.svgNode("text", { x: 0, y: yy + 4 }, svg); lt.textContent = j.length > 24 ? j.slice(0, 23) + "…" : j;
        U.svgNode("line", { x1: 170, x2: 980, y1: yy, y2: yy, stroke: "var(--line)", "stroke-dasharray": "2 4" }, svg);
        inst().filter(function (x) { return x.jurisdiction === j; }).forEach(function (x) {
          x.dates.forEach(function (d) {
            var g = U.svgNode("g", { class: "ev", tabindex: 0, role: "button", "aria-label": x.name + ": " + d.event + ", " + dateText(d.date) }, svg);
            U.svgNode("circle", { cx: X(d.date), cy: yy, r: 7, fill: COL[x.stage] || "var(--accent)" }, g);
            function det() { $("#tl-detail").innerHTML = "<b>" + dateText(d.date) + "</b>, " + esc(x.name) + ": " + esc(d.event) + ". <span class='pill " + esc(x.stage) + "'>" + esc(x.status) + "</span>"; }
            g.addEventListener("click", det); g.addEventListener("focus", det);
          });
        });
      });
      var now = X(new Date().toISOString().slice(0, 10)); U.svgNode("line", { x1: now, x2: now, y1: 22, y2: H - 8, stroke: "var(--warn)", "stroke-width": 2 }, svg);
      var tt = U.svgNode("text", { x: now + 5, y: H - 12 }, svg); tt.textContent = "today"; tt.setAttribute("style", "fill:var(--warn);font-weight:700");
    }
    sel.addEventListener("change", draw); draw();
  }

  /* ================= INDUSTRY ================= */
  U.inits.industry = function () {
    function compare() {
      var mw = parseFloat($("#ic-mw").value), t = parseFloat($("#ic-t").value), w = $("#ic-w").value;
      if (!(mw > 0) || !isFinite(t)) { $("#compare").innerHTML = '<div class="err">Enter an IT load above 0 MW and a water temperature.</div>'; return; }
      var designs = [["once_through", "Once-through", "Seawater or river water passes through once and returns warmer."], ["hybrid", "Hybrid", "Part of the heat goes to water, part to air. Assumes half to water."], ["closed_loop_air", "Closed loop", "Heat goes to air through dry coolers. PUE may be higher; enter your own in the full screening."]];
      var rs = designs.map(function (d) { return E.screen({ it_load_mw: mw, t_ambient_c: t, water_type: w, cooling_type: d[0] }); });
      var maxFlow = Math.max.apply(null, rs.map(function (r) { return r.flow_m3s; })) || 1;
      var score = rs.map(function (r) { return r.flags.filter(function (f) { return f.severity === "high"; }).length * 1000 + r.heat_to_water_mw; });
      var best = score.indexOf(Math.min.apply(null, score));
      $("#compare").innerHTML = rs.map(function (r, i) {
        var nf = r.near_field;
        return '<div class="opt' + (i === best ? " best" : "") + '"><h3>' + designs[i][1] + '</h3><p class="small muted">' + designs[i][2] + '</p><div class="small">Cooling flow</div><div class="bar"><i style="width:' + (100 * r.flow_m3s / maxFlow).toFixed(0) + '%"></i></div><dl>' +
          "<dt>Heat to water</dt><dd>" + fmt(r.heat_to_water_mw, 1) + " MW</dd><dt>Cooling flow</dt><dd>" + fmt(r.flow_m3s, 2) + " m³/s</dd><dt>US intake rules likely</dt><dd>" + (r.intake_316b.likely_applicable ? "Yes" : "No") + "</dd><dt>Screening rise</dt><dd>" + (nf ? fmt(nf.delta_t_near_field_k, 2) + " °C" : "none") + "</dd><dt>Action flags</dt><dd>" + r.flags.filter(function (f) { return f.severity === "high"; }).length + "</dd><dt>Reporting items</dt><dd>" + r.reporting.length + "</dd></dl>" + (i === best ? '<p class="small" style="margin:.7rem 0 0;color:var(--ok);font-weight:700">Lowest regulatory exposure</p>' : "") + "</div>";
      }).join("");
      trade(mw, t, w);
    }
    function trade(mw, t, w) {
      var pts = [], rise = [], allow = null;
      for (var dT = 2; dT <= 15.001; dT += 0.5) { var r = E.screen({ it_load_mw: mw, t_ambient_c: t, water_type: w, delta_t_k: dT }); pts.push([dT, r.flow_m3s]); rise.push([dT, r.near_field.delta_t_near_field_k]); allow = r.temperature_rule.allowed_increment_k; }
      var fmax = Math.max.apply(null, pts.map(function (p) { return p[1]; })) * 1.1, rmax = Math.max(allow * 1.3, Math.max.apply(null, rise.map(function (p) { return p[1]; })) * 1.15);
      var xAxis = { min: 2, max: 15, label: "ΔT across the heat exchanger (°C)" };
      var flowEl = $("#trade-chart-flow") || $("#trade-chart");
      var riseEl = $("#trade-chart-rise");
      U.chart(flowEl, { x: xAxis, y: { min: 0, max: fmax, label: "Cooling flow (m³/s)" },
        series: [{ pts: pts, color: "var(--accent)", width: 3 }] });
      if (riseEl) {
        U.chart(riseEl, { x: xAxis, y: { min: 0, max: rmax, label: "Screening surface rise (°C)" },
          series: [{ pts: rise, color: "var(--gold)", width: 3 }],
          hlines: [{ y: allow, color: "var(--warn)", dash: "6 4", label: "allowed " + fmt(allow, 2) + " °C" }] });
      }
    }
    ["#ic-mw", "#ic-t", "#ic-w"].forEach(function (s) { $(s).addEventListener("input", compare); });
    compare();
    new Tool($('[data-tool="technical"]'), "technical");
    function reuse() {
      var erf = +$("#r-erf").value / 100, mw = parseFloat($("#ic-mw").value) || 40;
      var a = E.screen({ it_load_mw: mw }), b = E.screen({ it_load_mw: mw, reuse_fraction: erf });
      $("#r-erf-o").textContent = Math.round(erf * 100) + "%";
      $("#reuse-nums").innerHTML = '<div class="h"><b>' + fmt(b.heat_reused_mw, 1) + ' MW</b><span>heat put to use</span></div><div><b>' + fmt(b.heat_to_water_mw, 1) + ' MW</b><span>still to water (was ' + fmt(a.heat_to_water_mw, 1) + ')</span></div><div><b>' + fmt(b.flow_m3s, 2) + ' m³/s</b><span>cooling flow (was ' + fmt(a.flow_m3s, 2) + ')</span></div>';
    }
    $("#r-erf").addEventListener("input", reuse); reuse();
  };
})();
</script>
