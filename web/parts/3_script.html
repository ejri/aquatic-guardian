<script>

<script>
(function () {
  "use strict";
  var E = window.AquaticGuardian, D = window.AG_DATA;
  function $(s, r) { return (r || document).querySelector(s); }
  function el(tag, attrs, html) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (html !== undefined) n.innerHTML = html;
    return n;
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function fmt(x, d) {
    if (x === null || x === undefined || isNaN(x)) return "n/a";
    if (!isFinite(x)) return "unbounded";
    var a = Math.abs(x);
    if (d === undefined) d = a >= 100 ? 0 : a >= 10 ? 1 : a >= 1 ? 2 : 3;
    return x.toLocaleString("en", { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  function toast(msg) { var t = $("#toast"); t.textContent = msg; t.classList.add("show"); setTimeout(function () { t.classList.remove("show"); }, 1800); }
  function copy(text, label) {
    function fallback() {
      var ta = el("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      toast(ok ? label + " copied" : "Select the text and copy it manually");
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast(label + " copied"); }, fallback);
    else fallback();
  }
  function md(text) {
    var out = [], list = false;
    text.split("\n").forEach(function (line) {
      var t = line.trim(), inline = esc(t.replace(/^- /, "")).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`(.+?)`/g, "<code>$1</code>");
      if (/^- /.test(t)) { if (!list) { out.push("<ul>"); list = true; } out.push("<li>" + inline + "</li>"); return; }
      if (list) { out.push("</ul>"); list = false; }
      if (t) out.push("<p>" + inline + "</p>");
    });
    if (list) out.push("</ul>");
    return out.join("");
  }

  /* hero */
  function hero() {
    var mw = parseFloat($("#h-mw").value), dt = parseFloat($("#h-dt").value);
    if (!(mw > 0) || !(dt > 0)) return;
    try {
      var r = E.screen({ it_load_mw: mw, delta_t_k: dt });
      $("#h-flow").textContent = fmt(r.flow_m3s, 2);
      $("#h-mgd").textContent = fmt(r.intake_316b.design_intake_mgd, 0);
      var ratio = r.intake_316b.design_intake_mgd / 2;
      $("#h-ratio").textContent = ratio >= 1 ? fmt(ratio, ratio >= 10 ? 0 : 1) : fmt(ratio, 2);
    } catch (e) {}
  }
  ["#h-mw", "#h-dt"].forEach(function (s) { $(s).addEventListener("input", hero); });
  hero();

  /* model language */
  var tabs = $("#lang-tabs"), panel = $("#lang-panel");
  function showGroup(i) {
    var g = D.policy[i];
    Array.prototype.forEach.call(tabs.children, function (b, j) { b.setAttribute("aria-selected", j === i ? "true" : "false"); b.tabIndex = j === i ? 0 : -1; });
    panel.setAttribute("aria-labelledby", "tab-" + g.key);
    var html = '<div class="intro">' + md(g.intro) + '</div>';
    g.clauses.forEach(function (c, k) {
      html += '<article class="clause"><div class="clause-head"><h3>' + esc(c.heading.replace(/^[A-Z]\d?\.\s*/, "")) +
        '</h3><button type="button" class="btn ghost small" data-copy="' + i + ":" + k + '">Copy clause</button></div>' +
        '<div class="clause-text">' + esc(c.text) + '</div></article>';
    });
    html += '<p class="src">Source file: <code>' + esc(g.path) + '</code>. CC BY 4.0.</p>';
    panel.innerHTML = html;
  }
  D.policy.forEach(function (g, i) {
    var b = el("button", { type: "button", role: "tab", id: "tab-" + g.key, "aria-controls": "lang-panel" }, esc(g.label));
    b.addEventListener("click", function () { showGroup(i); });
    tabs.appendChild(b);
  });
  tabs.addEventListener("keydown", function (e) {
    var cur = Array.prototype.indexOf.call(tabs.children, document.activeElement);
    if (cur < 0) return;
    var n = D.policy.length, next = e.key === "ArrowRight" ? (cur + 1) % n : e.key === "ArrowLeft" ? (cur - 1 + n) % n : -1;
    if (next >= 0) { e.preventDefault(); showGroup(next); tabs.children[next].focus(); }
  });
  panel.addEventListener("click", function (e) {
    var b = e.target.closest("[data-copy]"); if (!b) return;
    var p = b.getAttribute("data-copy").split(":"), c = D.policy[+p[0]].clauses[+p[1]];
    copy(c.text + "\n\nSource: Aquatic Guardian 0.1.0, " + D.policy[+p[0]].path + " (CC BY 4.0)", "Clause");
  });
  showGroup(0);

  /* brief downloads: links only, so the page still makes no network request of its own */
  $("#brief-links").innerHTML = D.briefs.map(function (b) {
    return '<li><a href="' + esc(b.url) + '" rel="noopener">' + esc(b.label) + "</a> <span class=\"src\">" +
      esc(b.file) + "</span></li>";
  }).join("");

  /* tracker */
  var inst = D.instruments;
  $("#as-of").textContent = new Date(inst.as_of + "T12:00:00Z").toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
  var juris = [];
  inst.instruments.forEach(function (x) { if (juris.indexOf(x.jurisdiction) < 0) juris.push(x.jurisdiction); });
  juris.forEach(function (j) { $("#f-juris").appendChild(el("option", { value: j }, esc(j))); });
  function dateText(d) { return new Date(d + "T12:00:00Z").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }); }
  function daysSince(d) { return Math.floor((Date.now() - new Date(d + "T12:00:00Z")) / 86400000); }
  function isStale(x) { return daysSince(x.last_checked) > inst.stale_after_days; }
  function renderTracker() {
    var st = $("#f-stage").value, jr = $("#f-juris").value, rows = "";
    inst.instruments.forEach(function (x) {
      var open = ["proposed", "consultation", "programme", "adopted"].indexOf(x.stage) >= 0;
      if (st === "open" && !open) return;
      if (st === "enacted" && x.stage !== "enacted") return;
      if (jr !== "all" && x.jurisdiction !== jr) return;
      var dates = x.dates.map(function (d) { return "<div><b>" + dateText(d.date) + "</b> " + esc(d.event) + "</div>"; }).join("");
      var checked = dateText(x.last_checked) + (isStale(x) ? '<span class="stale">' + daysSince(x.last_checked) + " days ago</span>" : "");
      var doubts = [];
      if (x.verify_note) doubts.push(x.verify_note);
      if (!x.sources || !x.sources.length) doubts.push("No primary-source link yet.");
      rows += "<tr><td><b>" + esc(x.name) + "</b><div class=\"src\">" + esc(x.jurisdiction) + "</div></td><td><span class=\"status " + esc(x.stage) + "\">" + esc(x.status) + "</span>" +
        (x.verify ? '<span class="verify" title="' + esc(doubts.join(" ")) + '">check</span><div class="src">' + esc(doubts.join(" ")) + "</div>" : "") + "</td><td>" + checked + "</td><td>" + (dates || "<span class=\"src\">n/a</span>") + "</td><td>" + esc(x.hook) + "</td><td>" + esc(x.action) + "</td></tr>";
    });
    $("#tracker-table tbody").innerHTML = rows || '<tr><td colspan="6">No instruments match these filters. Choose "All instruments" to see the full list.</td></tr>';
  }
  (function trackerNote() {
    var all = inst.instruments, stale = all.filter(isStale), unsourced = all.filter(function (x) { return !x.sources || !x.sources.length; });
    if (!stale.length && !unsourced.length) return;
    var parts = [];
    if (stale.length) parts.push("<strong>" + stale.length + " of " + all.length + "</strong> entries have not been checked against their source for more than " + inst.stale_after_days + " days");
    if (unsourced.length) parts.push("<strong>" + unsourced.length + "</strong> carry no primary-source link yet");
    $("#tracker-note").innerHTML = '<div class="deadline">' + parts.join(", and ") +
      ". Read the primary source before relying on a status or a date here. Corrections are welcome: <code>data/instruments.json</code>.</div>";
  })();
  $("#f-stage").addEventListener("change", renderTracker);
  $("#f-juris").addEventListener("change", renderTracker);
  renderTracker();
  (function deadline() {
    var d = inst.instruments.filter(function (x) { return x.deadline; })[0];
    if (!d) return;
    var days = Math.ceil((new Date(d.deadline + "T23:59:59Z") - new Date()) / 86400000);
    $("#deadline").innerHTML = days >= 0
      ? '<div class="deadline"><strong>' + days + ' days</strong> until the ' + esc(d.name.toLowerCase()) + ' closes on ' + dateText(d.deadline) + '. A draft response is in the EU tab of the model language above.</div>'
      : '<div class="deadline">The ' + esc(d.name.toLowerCase()) + ' closed on ' + dateText(d.deadline) + '. Check the tracker source for the next stage.</div>';
  })();

  /* screening tool */
  var FIELDS = [
    { g: "Facility", k: "it_load_mw", l: "IT load", u: "MW", t: "n", min: 0.5, max: 2000, step: 0.5, m: "public" },
    { g: "Facility", k: "cooling_type", l: "Cooling design", t: "s", m: "public", o: [["once_through", "Once-through water, or submerged"], ["hybrid", "Hybrid (part water, part air)"], ["closed_loop_air", "Closed loop to air"]] },
    { g: "Facility", k: "delta_t_k", l: "Cooling-water temperature rise", u: "°C", t: "n", min: 0.5, max: 25, step: 0.5, m: "public" },
    { g: "Facility", k: "pue", l: "PUE", t: "n", min: 1, max: 3, step: 0.01, m: "official", h: "Total facility power divided by IT power." },
    { g: "Facility", k: "reuse_pct", l: "Heat recovered before discharge", u: "%", t: "n", min: 0, max: 100, step: 1, m: "official", h: "Energy reuse factor (ISO/IEC 30134-6). Reuse after discharge does not count." },
    { g: "Facility", k: "aquaculture_reuse", l: "Recovered heat goes to aquaculture", t: "c", m: "official" },
    { g: "Facility", k: "cooling_fraction_pct", l: "Share of intake used for cooling", u: "%", t: "n", min: 0, max: 100, step: 1, m: "technical" },
    { g: "Facility", k: "fraction_to_water_pct", l: "Override: share of heat to water", u: "%", t: "n", min: 0, max: 100, step: 1, m: "technical", h: "Leave blank to use the cooling design default." , blank: true },
    { g: "Receiving water", k: "water_type", l: "Water body", t: "s", m: "public", o: [["marine", "Coastal sea"], ["estuarine", "Estuary or tidal river"], ["fresh", "River or lake"]] },
    { g: "Receiving water", k: "t_ambient_c", l: "Summer maximum water temperature", u: "°C", t: "n", min: 0, max: 32, step: 0.5, m: "public" },
    { g: "Receiving water", k: "s_psu", l: "Salinity", u: "psu", t: "n", min: 0, max: 40, step: 0.5, m: "official" },
    { g: "Receiving water", k: "ph", l: "pH", t: "n", min: 6, max: 9, step: 0.1, m: "official" },
    { g: "Receiving water", k: "depth_m", l: "Depth at the outfall", u: "m", t: "n", min: 1, max: 300, step: 1, m: "official" },
    { g: "Receiving water", k: "u_peak_ms", l: "Peak tidal current", u: "m/s", t: "n", min: 0.01, max: 3, step: 0.01, m: "official", h: "Use a NOAA CO-OPS or DFO/CHS station, not a guess." },
    { g: "Outfall", k: "n_ports", l: "Diffuser ports", t: "n", min: 1, max: 200, step: 1, m: "official" },
    { g: "Outfall", k: "port_diameter_m", l: "Port diameter", u: "m", t: "n", min: 0.05, max: 3, step: 0.05, m: "official" },
    { g: "Outfall", k: "port_spacing_m", l: "Port spacing", u: "m", t: "n", min: 0.5, max: 200, step: 0.5, m: "official" },
    { g: "Rules", k: "jurisdiction", l: "Jurisdiction", t: "s", m: "public", w: true,
      o: D.jurisdictions.map(function (j) { return [j.id, j.label]; }),
      h: function (s) { var j = E.jurisdiction(s.jurisdiction); return j.note + " Temperature rule status: " + j.temperature_status + (j.temperature_source ? " (" + j.temperature_source + ")" : ", no source transcribed") + ", as of " + j.status_as_of + ". Intake rule: " + j.intake_label + "."; } },
    { g: "Rules", k: "temperature_rule", l: "Temperature rule", t: "s", m: "official", w: true, h: "Set by the jurisdiction above. Change it only to screen against a different rule.", o: [["wa_marine", "Washington marine (WAC 173-201A-210)"], ["ca_new_coastal", "California Thermal Plan, new coastal"], ["custom", "Permit-specific increment"]] },
    { g: "Rules", k: "wa_category", l: "Washington marine category", t: "s", m: "official", show: function (f) { return f.temperature_rule === "wa_marine"; }, o: [["extraordinary", "Extraordinary (13 °C)"], ["excellent", "Excellent (16 °C)"], ["good", "Good (19 °C)"], ["fair", "Fair (22 °C)"]] },
    { g: "Rules", k: "custom_increment_k", l: "Allowed increment", u: "°C", t: "n", min: 0.1, max: 10, step: 0.1, m: "official", show: function (f) { return f.temperature_rule === "custom"; } },
    { g: "Model grid", k: "grid_dx_m", l: "Far-field grid spacing", u: "m", t: "n", min: 1, max: 1000, step: 1, m: "technical" },
    { g: "Model grid", k: "grid_dt_s", l: "Time step", u: "s", t: "n", min: 0.1, max: 600, step: 0.1, m: "technical" }
  ];
  var MODES = ["public", "official", "technical"], mode = "public";
  var state = { it_load_mw: 24, cooling_type: "once_through", delta_t_k: 8, pue: 1.15, reuse_pct: 0, aquaculture_reuse: false,
    cooling_fraction_pct: 100, fraction_to_water_pct: "", water_type: "marine", t_ambient_c: 12, s_psu: 30, ph: 8.0, depth_m: 20,
    u_peak_ms: 0.3, n_ports: 10, port_diameter_m: 0.3, port_spacing_m: 4,
    jurisdiction: E.DEFAULTS.jurisdiction, temperature_rule: E.jurisdiction(E.DEFAULTS.jurisdiction).temperature_rule,
    wa_category: "excellent", custom_increment_k: 1.0, grid_dx_m: 25, grid_dt_s: 10 };
  var form = $("#tool-form");
  function visible(f) { return MODES.indexOf(f.m) <= MODES.indexOf(mode) && (!f.show || f.show(state)); }
  function renderForm() {
    var groups = {}, order = [];
    FIELDS.forEach(function (f) { if (!visible(f)) return; if (!groups[f.g]) { groups[f.g] = []; order.push(f.g); } groups[f.g].push(f); });
    var html = "";
    order.forEach(function (g) {
      html += "<fieldset><legend>" + esc(g) + "</legend>";
      groups[g].forEach(function (f) {
        var id = "in-" + f.k, lab = esc(f.l) + (f.u ? " (" + esc(f.u) + ")" : "");
        var help = typeof f.h === "function" ? f.h(state) : f.h;
        if (f.t === "c") {
          html += '<div class="field check"><input type="checkbox" id="' + id + '" data-k="' + f.k + '"' + (state[f.k] ? " checked" : "") + '><label for="' + id + '">' + lab + "</label></div>";
          return;
        }
        html += '<div class="field' + (f.w ? " wide" : "") + '"><label for="' + id + '">' + lab + "</label>";
        var desc = help ? ' aria-describedby="' + id + '-h"' : "";
        if (f.t === "s") html += '<select id="' + id + '" data-k="' + f.k + '"' + desc + ">" + f.o.map(function (o) { return '<option value="' + o[0] + '"' + (state[f.k] === o[0] ? " selected" : "") + ">" + esc(o[1]) + "</option>"; }).join("") + "</select>";
        else html += '<input type="number" inputmode="decimal" id="' + id + '" data-k="' + f.k + '" min="' + f.min + '" max="' + f.max + '" step="' + f.step + '" value="' + esc(state[f.k]) + '"' + (f.blank ? ' placeholder="default"' : "") + desc + ">";
        if (help) html += '<small id="' + id + '-h">' + esc(help) + "</small>";
        html += "</div>";
      });
      html += "</fieldset>";
    });
    form.innerHTML = html;
  }
  form.addEventListener("input", function (e) {
    var k = e.target.getAttribute("data-k"); if (!k) return;
    state[k] = e.target.type === "checkbox" ? e.target.checked : (e.target.tagName === "SELECT" ? e.target.value : e.target.value);
    // The jurisdiction sets the temperature rule; both changes can show or hide fields.
    if (k === "jurisdiction") state.temperature_rule = E.jurisdiction(state.jurisdiction).temperature_rule;
    if (k === "jurisdiction" || k === "temperature_rule") { renderForm(); var n = $("#in-" + k); if (n) n.focus(); }
    run();
  });
  Array.prototype.forEach.call(document.querySelectorAll(".modes button"), function (b) {
    b.addEventListener("click", function () {
      mode = b.getAttribute("data-mode");
      Array.prototype.forEach.call(document.querySelectorAll(".modes button"), function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
      renderForm(); run();
    });
  });

  function inputs() {
    var num = function (k) { return parseFloat(state[k]); };
    var out = {
      it_load_mw: num("it_load_mw"), cooling_type: state.cooling_type, delta_t_k: num("delta_t_k"), pue: num("pue"),
      reuse_fraction: num("reuse_pct") / 100, aquaculture_reuse: !!state.aquaculture_reuse, cooling_fraction: num("cooling_fraction_pct") / 100,
      water_type: state.water_type, t_ambient_c: num("t_ambient_c"), s_psu: num("s_psu"), ph: num("ph"), depth_m: num("depth_m"),
      u_peak_ms: num("u_peak_ms"), n_ports: Math.round(num("n_ports")), port_diameter_m: num("port_diameter_m"), port_spacing_m: num("port_spacing_m"),
      jurisdiction: state.jurisdiction, temperature_rule: state.temperature_rule,
      wa_category: state.wa_category, custom_increment_k: num("custom_increment_k"),
      grid_dx_m: num("grid_dx_m"), grid_dt_s: num("grid_dt_s"),
      fraction_to_water: state.fraction_to_water_pct === "" || state.fraction_to_water_pct === null ? null : num("fraction_to_water_pct") / 100
    };
    var bad = [];
    for (var k in out) if (typeof out[k] === "number" && !isFinite(out[k])) bad.push(k);
    if (out.reuse_fraction < 0 || out.reuse_fraction > 1) bad.push("reuse");
    if (out.fraction_to_water !== null && (out.fraction_to_water < 0 || out.fraction_to_water > 1)) bad.push("share of heat to water");
    if (out.n_ports < 1) bad.push("ports");
    return { v: out, bad: bad };
  }

  function disclosure(r) {
    var i = r.inputs, h = 8760;
    // The schema wants ISO 3166-2 codes, so only jurisdiction ids that are already
    // in that form are carried over; anything broader stays UNSET for a person to fill in.
    var code = /^[a-z]{2}-[a-z]{2}$/.test(r.jurisdiction.id) ? r.jurisdiction.id.toUpperCase() : "UNSET";
    return {
      schema_version: "0.1.0",
      facility: { id: "UNSET", jurisdictions: [code], siting: "UNSET", it_capacity_mw: i.it_load_mw, pue: i.pue, cooling_type: i.cooling_type, location: { water_type: i.water_type } },
      reporting_period: { start: "UNSET", end: "UNSET" },
      thermal: { heat_rejected_mwh: +(r.heat_rejected_mw * h).toFixed(0), heat_to_water_mwh: +(r.heat_to_water_mw * h).toFixed(0), heat_reused_mwh: +(r.heat_reused_mw * h).toFixed(0),
        erf: i.reuse_fraction, discharge_delta_t_k: { max: i.delta_t_k },
        mixing_zone: { criterion_c: r.temperature_rule.criterion_c, criterion_basis: r.temperature_rule.basis, model: "aquatic_guardian " + E.version + " screening" } },
      intake: { design_intake_m3s: +r.flow_m3s.toFixed(4), cooling_fraction: i.cooling_fraction },
      biology: { impingement: [], entrainment: [] },
      provenance: { prepared_by: "UNSET", method: "design-value screening", tool_versions: ["aquatic_guardian " + E.version + " (browser)"], independently_verified: false, screening_only: true }
    };
  }

  function conditions(r) {
    var i = r.inputs, nf = r.near_field, rule = r.temperature_rule, c = [];
    c.push("<b>Temperature.</b> The increase above ambient at the edge of the mixing zone shall not exceed " + fmt(rule.allowed_increment_k, 2) + " °C (" + esc(rule.basis) + "), evaluated at slack water, an ambient temperature of " + fmt(i.t_ambient_c, 1) + " °C and the maximum discharge flow of " + fmt(r.flow_m3s, 3) + " m³/s.");
    if (r.flow_m3s > 0) c.push("<b>Intake.</b> Maximum through-screen design velocity 0.15 m/s (0.5 ft/s), requiring at least " + fmt(r.intake_316b.min_screen_open_area_m2, 1) + " m² of open screen area at the design intake of " + fmt(r.flow_m3s, 3) + " m³/s (" + fmt(r.intake_316b.design_intake_mgd, 1) + " MGD). Impingement and entrainment reported by taxon, life stage and sentience tier, with eggs and larvae as separate rows.");
    c.push("<b>Shutdown.</b> Planned shutdowns ramp the discharge temperature rise down at no more than [1] °C per [hour] in cold months; mortality within [500] m of the outfall reported within 24 hours.");
    c.push("<b>Chemicals.</b> Mass of each biocide, antifouling agent, corrosion inhibitor and coolant reported; no copper-based antifouling in critical habitat; no PFAS coolants.");
    c.push("<b>Monitoring.</b> Continuous temperature at the outfall, the mixing-zone edge and a reference site; dissolved oxygen at the edge in summer; detection-corrected occupancy surveys; data published within 90 days.");
    c.push("<b>Reopener.</b> Exceedance on more than [N] days a season, or a detection-corrected decline of a focal taxon, requires a heat-reduction plan within 30 days, which may include shifting compute to other sites.");
    if (i.aquaculture_reuse && i.reuse_fraction > 0) c.push("<b>Aquaculture.</b> Recovered heat counts toward reuse targets only if each farmed species is kept to [named welfare standard], with stocking density, mortality and stunning method reported.");
    return c;
  }

  function plain(r) {
    var i = r.inputs, nf = r.near_field, s = [];
    s.push("This facility rejects about <b>" + fmt(r.heat_rejected_mw, 1) + " MW</b> of heat, of which <b>" + fmt(r.heat_to_water_mw, 1) + " MW</b> goes into the water.");
    if (r.flow_m3s > 0) {
      var ir = r.jurisdiction.intake_rule, tail;
      if (ir === "us_cwa_316b") tail = r.intake_316b.likely_applicable ? "enough that US cooling-intake rules would likely apply." : "below the 2 MGD US cooling-intake threshold.";
      else if (ir === "ca_fisheries_act") tail = "drawn through works that can harmfully alter fish habitat, which needs a Fisheries Act authorisation. There is no numeric intake threshold to compare it with.";
      else tail = (r.intake_316b.design_intake_mgd > 2 ? "above" : "below") + " the US 2 MGD cooling-intake threshold, shown only for comparison: no intake rule for " + esc(r.jurisdiction.label) + " is on file here.";
      s.push("Carrying that heat takes about <b>" + fmt(r.flow_m3s * 1000, 0) + " litres of water a second</b>, " + tail);
      if (nf) {
        var placeholderRule = r.jurisdiction.temperature_status === "placeholder";
        s.push("Under the most conservative still-water assumption, the warm water is diluted about <b>" + fmt(nf.dilution, nf.dilution < 10 ? 1 : 0) + " times</b> by the time it reaches the surface, leaving a rise of <b>" + fmt(nf.delta_t_near_field_k, 2) + " °C</b>. " +
          (placeholderRule
            ? "No published limit is on file for " + esc(r.jurisdiction.label) + ", so the " + fmt(r.temperature_rule.allowed_increment_k, 2) + " °C allowance is the figure you entered: the rise " + (nf.meets_rule ? "is below it" : "is above it") + ", which is arithmetic rather than a compliance finding."
            : "The rule for " + esc(r.jurisdiction.label) + " allows " + fmt(r.temperature_rule.allowed_increment_k, 2) + " °C, so this design " + (nf.meets_rule ? "<b>passes the screen</b>." : "<b>fails the screen</b> and needs a redesign or a full study.")));
      }
      s.push("Water leaving at " + fmt(i.t_ambient_c + i.delta_t_k, 1) + " °C holds " + fmt(r.water_quality.do_sat_drop_frac * 100, 0) + "% less oxygen than the surrounding water, at the same time as animals in it need more.");
    } else s.push("It rejects heat to air, so there is no cooling-water intake or thermal discharge to screen.");
    return s.join(" ");
  }

  function run() {
    var res = $("#results"), inp = inputs();
    if (inp.bad.length) { res.innerHTML = '<div class="error">Check these fields: ' + esc(inp.bad.join(", ")) + ". Each needs a number within its range.</div>"; return; }
    var r;
    try { r = E.screen(inp.v); } catch (e) { res.innerHTML = '<div class="error">' + esc(e.message) + ". Adjust the value and the results will update.</div>"; return; }
    var nf = r.near_field, html = '<p class="summary">' + plain(r) + "</p>";
    html += '<div class="nums">' +
      '<div class="num heat"><strong>' + fmt(r.heat_to_water_mw, 1) + ' MW</strong><span>heat to water</span></div>' +
      '<div class="num"><strong>' + fmt(r.flow_m3s, 2) + ' m³/s</strong><span>cooling flow (' + fmt(r.intake_316b.design_intake_mgd, 1) + ' MGD)</span></div>' +
      (nf ? '<div class="num heat"><strong>' + fmt(nf.delta_t_near_field_k, 2) + ' °C</strong><span>screening rise at surface</span></div>' : "") +
      '<div class="num"><strong>' + fmt(r.temperature_rule.allowed_increment_k, 2) + ' °C</strong><span>allowed increment</span></div>' +
      '<div class="num"><strong>' + fmt(r.tidal_excursion_m / 1000, 2) + ' km</strong><span>tidal excursion per half-cycle</span></div>' +
      '<div class="num"><strong>' + fmt(r.water_quality.nh3_frac_ratio, 2) + '×</strong><span>toxic ammonia fraction at discharge</span></div>' +
      "</div>";
    if (nf) {
      var max = Math.max(nf.delta_t_near_field_k, r.temperature_rule.allowed_increment_k) * 1.25;
      html += '<div class="gauge" role="img" aria-label="Screening rise ' + fmt(nf.delta_t_near_field_k, 2) + ' degrees against an allowed ' + fmt(r.temperature_rule.allowed_increment_k, 2) + ' degrees">' +
        '<div class="gauge-track"><div class="gauge-fill" style="width:' + (100 * nf.delta_t_near_field_k / max).toFixed(1) + '%"></div>' +
        '<div class="gauge-mark" style="left:' + (100 * r.temperature_rule.allowed_increment_k / max).toFixed(1) + '%"></div></div>' +
        '<div class="gauge-legend"><span>Screening rise (bar)</span><span>Allowed increment (line)</span></div></div>';
    }
    if (r.flags.length) {
      html += '<h3>What this triggers</h3><ul class="flags">' + r.flags.map(function (f) {
        var lab = { high: "Action", caution: "Caution", info: "Note" }[f.severity];
        return '<li><span class="sev ' + f.severity + '">' + lab + "</span><span>" + esc(f.text) + "</span></li>";
      }).join("") + "</ul>";
    }
    if (r.reporting.length) html += '<div class="out-block"><h3>Animals and welfare: what must be reported</h3><ul>' + r.reporting.map(function (x) { return "<li>" + esc(x.charAt(0).toUpperCase() + x.slice(1)) + "</li>"; }).join("") + "</ul></div>";
    if (mode !== "public") {
      var jr = r.jurisdiction;
      html += '<div class="out-block"><h3>Draft permit conditions <button type="button" class="btn ghost small" id="copy-cond">Copy conditions</button></h3>' +
        '<p class="src">Jurisdiction: ' + esc(jr.label) + '. Temperature rule: ' + esc(jr.temperature_status) +
        (jr.temperature_source ? ", " + esc(jr.temperature_source) : ", no source transcribed in this repository") +
        ' (status as of ' + esc(jr.status_as_of) + '). Intake rule: ' + esc(jr.intake_source) + '</p>' +
        (jr.verify ? '<p class="src"><span class="verify">check</span> ' + esc(jr.verify_note || "") + "</p>" : "") +
        '<ol class="conditions">' + conditions(r).map(function (c) { return "<li>" + c + "</li>"; }).join("") + "</ol></div>";
      var j = JSON.stringify(disclosure(r), null, 2);
      html += '<div class="out-block"><h3>Aquatic Disclosure Record (design values) <button type="button" class="btn ghost small" id="copy-json">Copy JSON</button></h3><pre class="json" tabindex="0">' + esc(j) + "</pre></div>";
    }
    if (mode === "technical" && nf) {
      var rows = [["Reduced gravity g′", fmt(nf.g_prime, 4) + " m/s²"], ["Regime (s/H = " + fmt(nf.s_over_H, 2) + ")", nf.regime], ["Jet velocity", fmt(nf.jet_velocity_ms, 2) + " m/s"],
        ["Dilution, point-plume envelope", fmt(nf.dilution_point, 1)], ["Dilution, line plume", fmt(nf.dilution_line, 1)], ["Jet-dominated at this depth", nf.jet_dominated ? "yes" : "no"],
        ["Error if total flow used in point law", fmt(nf.total_flow_error_factor, 2) + "×"], ["Upwind numerical diffusion", fmt(r.numerics.k_num_upwind_m2s, 2) + " m²/s"],
        ["Okubo diffusivity at grid scale", fmt(r.numerics.k_okubo_at_dx_m2s, 4) + " m²/s"], ["Okubo diffusivity at 1 km", fmt(r.numerics.k_okubo_1km_m2s, 2) + " m²/s"],
        ["Scale where numerical = physical", fmt(r.numerics.crossover_scale_m / 1000, 2) + " km"], ["Estuary 1% volume test", fmt(r.tidal_volume_check.fraction * 100, 3) + "%"],
        ["DO saturation, ambient / discharge", fmt(r.water_quality.do_sat_ambient_mg_l, 2) + " / " + fmt(r.water_quality.do_sat_discharge_mg_l, 2) + " mg/L"],
        ["Un-ionised NH₃, ambient / discharge", fmt(r.water_quality.nh3_frac_ambient * 100, 2) + " / " + fmt(r.water_quality.nh3_frac_discharge * 100, 2) + " %"]];
      html += '<div class="out-block"><h3>Technical detail</h3><div class="scroll" role="region" aria-label="Technical detail" tabindex="0"><table class="tech"><tbody>' + rows.map(function (x) { return "<tr><td>" + esc(x[0]) + "</td><td>" + esc(x[1]) + "</td></tr>"; }).join("") + "</tbody></table></div></div>";
    }
    html += '<p class="caveat">Screening only: stagnant, unstratified near field (the slack-water case), no far-field transport, no species-specific thresholds. Not legal advice. Engine ' + esc(E.version) + ", tested against the Python reference.</p>";
    res.innerHTML = html;
    var cc = $("#copy-cond"); if (cc) cc.addEventListener("click", function () { copy(conditions(r).map(function (c, n) { return (n + 1) + ". " + c.replace(/<[^>]+>/g, ""); }).join("\n\n"), "Conditions"); });
    var cj = $("#copy-json"); if (cj) cj.addEventListener("click", function () { copy(JSON.stringify(disclosure(r), null, 2), "JSON"); });
  }
  renderForm(); run();

  /* nav highlight */
  if ("IntersectionObserver" in window) {
    var links = {}; Array.prototype.forEach.call(document.querySelectorAll("nav.primary a"), function (a) { links[a.getAttribute("href").slice(1)] = a; });
    var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting && links[e.target.id]) { for (var k in links) links[k].removeAttribute("aria-current"); links[e.target.id].setAttribute("aria-current", "true"); } }); }, { rootMargin: "-40% 0px -55% 0px" });
    Object.keys(links).forEach(function (id) { var s = document.getElementById(id); if (s) io.observe(s); });
  }
})();
</script>
</body>
</html>
