# Netlify configuration for the Aquatic Guardian website.
#
# Nothing is built on Netlify: site/ already contains the finished files, and CI
# runs `python app/build.py --check` on every push, so a stale site/index.html
# fails the build before it can be deployed. Edit web/parts/*.html instead.
#
# Connection steps are in docs/DEPLOY.md.

[build]
  publish = "site"
  command = ""

# The page is self-contained. The only permitted network requests are the Google
# Fonts stylesheet (fonts.googleapis.com) and the font files it references
# (fonts.gstatic.com). Scripts and styles are inline, so 'unsafe-inline' is
# required; there is no remote script origin of any kind.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "accelerometer=(), ambient-light-sensor=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Frame-Options = "DENY"
