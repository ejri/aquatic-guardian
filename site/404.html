<style>
:root{
  --bg:#E8EFF0; --surface:#FFFFFF; --surface-2:#F4F8F8; --ink:#061E27; --muted:#48656E; --line:#C8D7DA;
  --accent:#0A6A86; --accent-ink:#FFFFFF; --warn:#AE3F17; --ok:#1C7550; --gold:#B7790A;
  --deep:#03121A; --deep-2:#082029; --deep-3:#0E2C38; --deep-ink:#DCEAEE; --deep-muted:#8AA7B0; --deep-line:#1A3a46; --glow:#F7B24A; --ice:#9ED8E6;
  --display:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --serif:"Source Serif 4","Iowan Old Style",Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --wide:1240px; --measure:66ch; --r:6px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#051820; --surface:#0B2530; --surface-2:#0F2B37; --ink:#E2ECEE; --muted:#93AEB5; --line:#1E3C47;
  --accent:#63C5DC; --accent-ink:#03121A; --warn:#FF9470; --ok:#62D49D; --gold:#F2B94C; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#051820; --surface:#0B2530; --surface-2:#0F2B37; --ink:#E2ECEE; --muted:#93AEB5; --line:#1E3C47;
  --accent:#63C5DC; --accent-ink:#03121A; --warn:#FF9470; --ok:#62D49D; --gold:#F2B94C; color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 5rem);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.55 var(--sans)}
img,svg,canvas{max-width:100%}
a{color:var(--accent);text-underline-offset:.18em;text-decoration-thickness:1px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
button{font:inherit;color:inherit}
.wrap{max-width:var(--wide);margin:0 auto;padding:0 clamp(1rem,3vw,2rem)}
.skip{position:absolute;left:-999px;top:0;z-index:50;background:var(--glow);color:#000;padding:.6rem 1rem}
.skip:focus{left:1rem;top:calc(env(safe-area-inset-top,0px) + .5rem)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3,h4{margin:0;line-height:1.08;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
.display{font-family:var(--display);font-weight:800;letter-spacing:-.005em;line-height:.95}
h2.section{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,5vw,3.6rem);line-height:.98;margin:0 0 .8rem}
h3{font-size:1.2rem;font-weight:700;margin-bottom:.4rem}
p{margin:0 0 1rem}
.lede{font-size:clamp(1.1rem,1.6vw,1.3rem);color:var(--muted);max-width:58ch}
.serif{font-family:var(--serif);font-size:1.08rem;line-height:1.68}
.small{font-size:.9rem}.muted{color:var(--muted)}
code{font-family:var(--mono);font-size:.86em}

/* header */
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--deep) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--deep-ink);border-bottom:1px solid var(--deep-line)}
header.site .wrap{display:flex;align-items:center;gap:.4rem 1.25rem;min-height:4rem;flex-wrap:wrap}
@media (max-width:820px){header.site .wrap{padding-top:.5rem;padding-bottom:.35rem}nav.primary{order:2;width:100%;margin-left:-.8rem}}
.brand{display:flex;align-items:center;gap:.65rem;color:var(--deep-ink);text-decoration:none;flex:none}
.brand svg{width:30px;height:30px;flex:none}
.brand img.sf-mark{width:30px;height:30px;border-radius:6px;flex:none;display:block}
.brand b{font-family:var(--display);font-weight:800;font-size:1.45rem;letter-spacing:.01em;line-height:1}
.brand small{display:block;font-size:.72rem;color:var(--deep-muted);letter-spacing:.02em}
.brand .brand-text{display:flex;flex-direction:column;gap:.15rem;min-width:0}
.sf-wordmark,.sf-lockup{display:block;height:auto;max-width:100%}
.sf-wordmark{width:min(16rem,70vw);margin-top:1.1rem}
.sf-lockup{width:min(18rem,85vw);margin-top:.4rem}
.sf-credit{display:flex;flex-wrap:wrap;align-items:center;gap:.85rem 1.25rem;margin-top:1.2rem}
.sf-credit img.sf-mark{width:2.5rem;height:2.5rem;border-radius:8px;flex:none}
footer.site .sf-mark{width:2.75rem;height:2.75rem;border-radius:8px;display:block;margin-bottom:.55rem}
nav.primary{display:flex;gap:.3rem;margin-left:auto;overflow-x:auto;scrollbar-width:none}
nav.primary::-webkit-scrollbar{display:none}
nav.primary a{color:var(--deep-ink);text-decoration:none;font-size:.93rem;font-weight:500;white-space:nowrap;padding:.55rem .85rem;border-radius:999px;min-height:2.75rem;display:inline-flex;align-items:center}
nav.primary a:hover{background:var(--deep-3)}
nav.primary a[aria-current="page"]{background:var(--glow);color:#1b1100;font-weight:700}

/* routes */
[data-route]{display:none}
[data-route].on{display:block}

/* deep (always dark) surfaces */
.deep{background:var(--deep);color:var(--deep-ink)}
.deep .muted,.deep .lede{color:var(--deep-muted)}
.deep a{color:var(--ice)}

/* hero */
.hero{position:relative;min-height:min(92vh,56rem);display:flex;align-items:flex-end;overflow:hidden;isolation:isolate}
.hero>canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-2}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(3,18,26,.94) 0%,rgba(3,18,26,.72) 38%,rgba(3,18,26,.12) 70%,rgba(3,18,26,0) 100%),linear-gradient(0deg,rgba(3,18,26,.92) 0%,rgba(3,18,26,0) 45%)}
.hero .wrap{width:100%;padding-bottom:clamp(2.5rem,7vw,5rem);padding-top:6rem}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(3.2rem,9.5vw,7.8rem);line-height:.86;letter-spacing:-.01em;max-width:11ch;margin-bottom:1.4rem}
.hero h1 em{font-style:normal;color:var(--glow)}
.hero .lede{color:#C4D7DC;max-width:46ch;margin-bottom:1.6rem}
.hero-live{position:absolute;right:clamp(1rem,3vw,2rem);top:5.2rem;display:flex;flex-direction:column;align-items:flex-end;gap:.45rem;font-size:.82rem;color:var(--deep-muted);text-align:right}
.hero-live .chip{background:rgba(3,18,26,.7);border:1px solid var(--deep-line);border-radius:999px;padding:.3rem .75rem;color:var(--deep-ink);font-variant-numeric:tabular-nums}
.cbar{width:220px;height:8px;border-radius:4px}
.cbar-l{display:flex;justify-content:space-between;gap:.5rem;width:220px;white-space:nowrap}

.btn{display:inline-flex;align-items:center;gap:.5rem;font:700 1rem/1 var(--sans);padding:.9rem 1.25rem;border-radius:999px;border:2px solid transparent;text-decoration:none;cursor:pointer;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn.glow{background:var(--glow);color:#1b1100}
.btn.line{border-color:currentColor;color:inherit;background:transparent}
.btn.acc{background:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:.5rem .85rem;font-size:.86rem}
.row{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center}

/* doors */
.doors{display:grid;grid-template-columns:1fr;gap:0;border-top:1px solid var(--deep-line)}
@media (min-width:760px){.doors{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1100px){.doors{grid-template-columns:repeat(4,1fr)}}
.door{position:relative;display:flex;flex-direction:column;gap:.7rem;padding:2rem 1.6rem 2.2rem;color:var(--deep-ink);text-decoration:none;border-bottom:1px solid var(--deep-line);min-height:22rem;overflow:hidden;transition:background .2s}
@media (min-width:760px){.door{border-right:1px solid var(--deep-line)}}
.door:hover{background:var(--deep-2)}
.door .who{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:.95}
.door .promise{color:#BFD3D8;max-width:30ch}
.door ul{list-style:none;padding:0;margin:.3rem 0 0;font-size:.92rem;color:var(--deep-muted)}
.door li{padding:.28rem 0;border-top:1px dashed var(--deep-line)}
.door .go{margin-top:auto;font-weight:700;color:var(--glow)}
.door svg.art{height:64px;width:auto;align-self:flex-start;margin-bottom:.4rem}

/* numbers band */
.band{padding:clamp(3rem,7vw,5.5rem) 0}
.numbers{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:2rem 2.5rem}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(3rem,6vw,4.6rem);line-height:.9;color:var(--accent);font-variant-numeric:tabular-nums}
.deep .stat b{color:var(--glow)}
.stat span{display:block;margin-top:.5rem;color:var(--muted);max-width:28ch}
.deep .stat span{color:var(--deep-muted)}

/* system diagram */
.system svg{width:100%;height:auto;display:block}
.system .node{cursor:pointer}
.system .node:hover rect{stroke:var(--glow)}

/* page heads */
.pagehead{padding:clamp(3rem,8vw,6rem) 0 clamp(2rem,5vw,3.5rem);position:relative;overflow:hidden}
.pagehead .kicker{font-weight:700;color:var(--glow);margin-bottom:.8rem}
.pagehead h1{font-family:var(--display);font-weight:800;font-size:clamp(2.8rem,7.5vw,6rem);line-height:.9;max-width:14ch;margin-bottom:1.2rem}
.pagehead .lede{color:#C4D7DC}
.pagehead .wrap{position:relative;z-index:1}
.pagehead .art-bg{position:absolute;z-index:0;right:-4rem;top:50%;transform:translateY(-50%);width:min(52vw,44rem);opacity:.9;pointer-events:none;-webkit-mask-image:radial-gradient(closest-side,#000 55%,transparent);mask-image:radial-gradient(closest-side,#000 55%,transparent)}
@media (max-width:760px){.pagehead .art-bg{opacity:.25;right:-10rem}}
.jump{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.6rem}
.jump button{background:rgba(255,255,255,.06);border:1px solid var(--deep-line);color:var(--deep-ink);padding:.45rem .85rem;border-radius:999px;cursor:pointer;font-size:.9rem}
.jump button:hover{border-color:var(--glow)}

section.block{padding:clamp(3rem,7vw,5.5rem) 0}
section.block+section.block{border-top:1px solid var(--line)}
.deep section.block+section.block,.deep+.deep{border-top:1px solid var(--deep-line)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:2.5rem}
@media (min-width:960px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4rem}.grid2.wide-left{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}.grid2.wide-right{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}}

/* instruments (sims): always dark */
.inst{background:var(--deep);color:var(--deep-ink);border-radius:14px;border:1px solid var(--deep-line);overflow:hidden}
.inst-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:.5rem 1rem;padding:1rem 1.2rem;border-bottom:1px solid var(--deep-line);background:var(--deep-2)}
.inst-head h3{margin:0;font-family:var(--display);font-weight:700;font-size:1.55rem;letter-spacing:.005em}
.inst-head .tag{font-size:.78rem;color:var(--deep-muted)}
.inst-body{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
@media (min-width:1000px){.inst-body{grid-template-columns:minmax(0,1fr) 19rem}}
.inst-view{position:relative;padding:1rem;min-width:0}
.inst-view canvas{display:block;width:100%;height:auto;border-radius:8px;background:#021017}
.inst-ctrl{padding:1rem 1.2rem 1.3rem;border-top:1px solid var(--deep-line);background:var(--deep-2)}
@media (min-width:1000px){.inst-ctrl{border-top:0;border-left:1px solid var(--deep-line)}}
.ctl{margin-bottom:.95rem}
.ctl label{display:flex;justify-content:space-between;gap:.5rem;font-size:.86rem;color:var(--deep-muted);margin-bottom:.3rem}
.ctl label output{color:var(--deep-ink);font-weight:700;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--glow);height:1.6rem}
.seg{display:inline-flex;border:1px solid var(--deep-line);border-radius:999px;overflow:hidden}
.seg button{background:transparent;border:0;padding:.42rem .8rem;font-size:.85rem;color:var(--deep-ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--glow);color:#1b1100;font-weight:700}
.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(6.4rem,1fr));gap:.1rem;margin-top:.8rem;border-radius:8px;overflow:hidden}
.ro{background:var(--deep-3);padding:.65rem .75rem}
.ro b{display:block;font-family:var(--display);font-weight:700;font-size:1.6rem;line-height:1;font-variant-numeric:tabular-nums}
.ro span{font-size:.76rem;color:var(--deep-muted)}
.ro.hot b{color:var(--glow)}
.ro.bad b{color:#FF8E6E}
.ro.good b{color:#7FE0B0}
.finding{margin:1rem 1.2rem 1.2rem;padding:.9rem 1rem;border-left:3px solid var(--glow);background:rgba(247,178,74,.07);font-size:.95rem;line-height:1.55}
.finding b{color:var(--glow)}
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1rem;font-size:.8rem;color:var(--deep-muted);margin-top:.6rem}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:.35rem}
.dual{display:grid;grid-template-columns:minmax(0,1fr);gap:.8rem}
@media (min-width:700px){.dual{grid-template-columns:1fr 1fr}}
.dual figcaption{font-size:.82rem;color:var(--deep-muted);margin-top:.35rem;display:flex;justify-content:space-between;gap:.5rem}
figure{margin:0}
svg.chart text{fill:var(--deep-muted);font:11px var(--sans)}
svg.chart .axis{stroke:var(--deep-line)}
.light svg.chart text{fill:var(--muted)}
.light svg.chart .axis{stroke:var(--line)}

/* lab layout */
.lab{display:grid;grid-template-columns:minmax(0,1fr);gap:2rem}
@media (min-width:1100px){.lab{grid-template-columns:14rem minmax(0,1fr);gap:3rem}}
.lab-index{position:sticky;top:5.5rem;align-self:start;display:none}
@media (min-width:1100px){.lab-index{display:block}}
.lab-index h4{font-family:var(--display);font-weight:700;font-size:1.15rem;margin:1.2rem 0 .4rem;color:var(--deep-ink)}
.lab-index a{display:block;color:var(--deep-muted);text-decoration:none;font-size:.9rem;padding:.25rem 0 .25rem .7rem;border-left:2px solid var(--deep-line)}
.lab-index a:hover,.lab-index a.here{color:var(--deep-ink);border-left-color:var(--glow)}
.nb{margin-bottom:4.5rem}
.nb-head{display:grid;grid-template-columns:minmax(0,1fr);gap:1.5rem;margin-bottom:1.6rem}
@media (min-width:900px){.nb-head{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}}
.nb-head h2{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,4.5vw,3.4rem);line-height:.95;margin-bottom:.6rem}
.nb-num{font-family:var(--display);font-weight:800;color:var(--glow);font-size:1.05rem;margin-bottom:.3rem}
.reported{border:1px solid var(--deep-line);border-radius:10px;padding:1rem 1.1rem;background:var(--deep-2)}
.reported h4{font-size:.85rem;color:var(--deep-muted);font-weight:600;margin-bottom:.6rem}
.reported details{border-top:1px solid var(--deep-line);padding:.55rem 0}
.reported summary{cursor:pointer;font-weight:600}
.reported details p{margin:.4rem 0 0;color:#BCD0D5;font-size:.93rem}
.stack>*+*{margin-top:1.5rem}
pre.json{background:#021017;color:#BCD7DD;border:1px solid var(--deep-line);border-radius:8px;padding:.9rem;max-height:18rem;overflow:auto;font:12px/1.5 var(--mono);margin:.6rem 0 0}
.light pre.json{background:var(--surface-2);color:var(--ink);border-color:var(--line)}

/* tables */
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;vertical-align:top;padding:.6rem .75rem;border-bottom:1px solid var(--line)}
th{font-weight:700;background:var(--surface-2)}
.deep th{background:var(--deep-2);border-color:var(--deep-line)}.deep td{border-color:var(--deep-line)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.deep .scroll{border-color:var(--deep-line);background:var(--deep)}
.scroll table{min-width:640px}
.pill{display:inline-block;font-size:.78rem;font-weight:700;padding:.15rem .55rem;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.tl-legend{display:flex;flex-wrap:wrap;gap:.3rem 1rem;font-size:.85rem;color:var(--muted);margin-top:.6rem}.tl-legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:.35rem;vertical-align:-1px}
.pill.enacted{background:color-mix(in srgb,var(--ok) 14%,transparent);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.pill.proposed,.pill.consultation,.pill.adopted,.pill.programme{background:color-mix(in srgb,var(--gold) 16%,transparent);border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.pill.failed{background:color-mix(in srgb,var(--warn) 12%,transparent);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.chk{color:var(--warn);font-weight:700;font-size:.8rem;margin-left:.3rem}

/* public: cross-section */
.xsec{background:var(--deep);border-radius:16px;overflow:hidden;border:1px solid var(--deep-line)}
.xsec svg{display:block;width:100%;height:auto}
.xsec .muted,.xsec .lede{color:var(--deep-muted)}
.hot-btn{cursor:pointer}
.hot-btn circle.ring{fill:var(--glow);stroke:#1b1100;stroke-width:2}
.hot-btn[aria-pressed="true"] circle.ring{fill:#fff}
.hot-btn text{font:800 15px var(--display);fill:#1b1100}
.xsec-panel{display:grid;grid-template-columns:minmax(0,1fr);gap:0;border-top:1px solid var(--deep-line)}
@media (min-width:900px){.xsec-panel{grid-template-columns:minmax(0,1fr) 20rem}}
.xsec-text{padding:1.4rem 1.5rem;color:var(--deep-ink)}
.xsec-text h3{font-family:var(--display);font-weight:800;font-size:2rem;margin-bottom:.5rem}
.xsec-text .big{font-family:var(--display);font-weight:800;font-size:3rem;color:var(--glow);line-height:1}
.xsec-side{padding:1.4rem 1.5rem;background:var(--deep-2);border-top:1px solid var(--deep-line)}
@media (min-width:900px){.xsec-side{border-top:0;border-left:1px solid var(--deep-line)}}
.steps-nav{display:flex;gap:.4rem;margin-top:1rem}
.steps-nav button{flex:1;background:var(--deep-3);border:1px solid var(--deep-line);color:var(--deep-ink);border-radius:8px;padding:.55rem .4rem;cursor:pointer;font-size:.85rem}
.steps-nav button[aria-pressed="true"]{border-color:var(--glow);color:var(--glow);font-weight:700}

.beings{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:1rem}
.being{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.1rem 1.1rem 1.2rem}
.being svg{height:56px;width:auto;margin-bottom:.6rem;color:var(--accent)}
.being b{display:block;font-size:1.02rem}
.being .tier{font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:.35rem}
.being p{font-size:.92rem;color:var(--muted);margin:0}
.being.t1{border-top:4px solid var(--accent)}
.being.t2{border-top:4px solid var(--gold)}
.being.tx{border-top:4px dashed var(--muted)}

.actions3{display:grid;grid-template-columns:minmax(0,1fr);gap:1.2rem}
@media (min-width:900px){.actions3{grid-template-columns:repeat(3,1fr)}}
.act{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.3rem;display:flex;flex-direction:column;gap:.6rem}
.act .countdown{font-family:var(--display);font-weight:800;font-size:3.4rem;line-height:.9;color:var(--accent)}
textarea.letter{width:100%;min-height:13rem;font:.95rem/1.55 var(--serif);border:1px solid var(--line);border-radius:8px;padding:.8rem;background:var(--surface-2);color:var(--ink);resize:vertical}
select,input[type="number"],input[type="text"]{font:inherit;font-size:.97rem;color:var(--ink);background:var(--surface);border:1px solid var(--muted);border-radius:6px;padding:.5rem .6rem;min-height:2.6rem;max-width:100%}
.deep select,.deep input[type="number"]{background:var(--deep-3);color:var(--deep-ink);border-color:var(--deep-line)}
details.faq{border-top:1px solid var(--line);padding:1rem 0}
details.faq summary{cursor:pointer;font-weight:700;font-size:1.08rem}
details.faq p{margin:.6rem 0 0;max-width:var(--measure)}

/* officials */
.jur{display:flex;flex-wrap:wrap;gap:.5rem;margin:0 0 1.5rem}
.jur button{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.7rem 1rem;border-radius:10px;cursor:pointer;font-weight:600;display:flex;flex-direction:column;align-items:flex-start;gap:.15rem;min-width:9rem}
.jur button small{font-weight:400;color:var(--muted);font-size:.78rem}
.jur button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.jur button[aria-selected="true"] small{color:color-mix(in srgb,var(--bg) 75%,transparent)}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:clamp(1.2rem,3vw,2.2rem);box-shadow:0 1px 0 var(--line)}
.doc .status{font-size:.96rem;margin-bottom:1.4rem;padding-bottom:1rem;border-bottom:1px solid var(--line)}
.doc .status ul{padding-left:1.2rem;margin:.3rem 0}
.clause{margin:0 0 1.8rem}
.clause-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:.4rem 1rem;margin-bottom:.45rem}
.clause-h h3{font-size:1.02rem;margin:0}
.clause-t{font-family:var(--serif);font-size:1.03rem;line-height:1.72;white-space:pre-line;padding-left:1rem;border-left:3px solid var(--line)}
.brief{position:sticky;top:5.5rem;display:flex;flex-direction:column;gap:1rem}
.brief .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.1rem 1.2rem}
.brief .card h3{font-size:1rem}
.brief ul{padding-left:1.1rem;margin:.2rem 0 0}
.brief li{margin-bottom:.5rem;font-size:.94rem}
.timeline{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem;overflow-x:auto}
.timeline svg{min-width:760px;width:100%;height:auto;display:block}
.timeline text{fill:var(--muted);font:12px var(--sans)}
.timeline .ev{cursor:pointer}
.timeline .ev:hover circle,.timeline .ev:focus circle{stroke:var(--ink);stroke-width:2}
.tl-detail{min-height:2.8rem;font-size:.95rem;margin-top:.6rem}
.pipeline{display:grid;grid-template-columns:minmax(0,1fr);gap:0;counter-reset:l}
@media (min-width:1000px){.pipeline{grid-template-columns:repeat(5,1fr)}}
.stage{position:relative;padding:1.2rem 1.1rem 1.3rem;border:1px solid var(--line);background:var(--surface);counter-increment:l}
@media (min-width:1000px){.stage+.stage{border-left:0}.stage:first-child{border-radius:12px 0 0 12px}.stage:last-child{border-radius:0 12px 12px 0}}
.stage::before{content:counter(l);display:block;font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1;color:var(--accent);margin-bottom:.3rem}
.stage h3{font-size:1.05rem}
.stage p{font-size:.9rem;color:var(--muted);margin:0 0 .6rem}
.stage .att{font-size:.8rem;color:var(--ink);border-top:1px dashed var(--line);padding-top:.5rem}

/* tool */
.tool{display:grid;grid-template-columns:minmax(0,1fr);gap:1.5rem}
@media (min-width:1000px){.tool{grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:2.5rem}}
fieldset{border:0;padding:0;margin:0 0 1.3rem}
legend{font-weight:700;margin-bottom:.5rem;padding:0}
.field{display:grid;grid-template-columns:minmax(0,1fr) minmax(8rem,13rem);gap:.35rem .8rem;align-items:center;padding:.42rem 0;border-bottom:1px solid var(--line)}
.field label{font-size:.93rem}
.field small{grid-column:1/-1;color:var(--muted);font-size:.82rem;margin-top:-.15rem}
.field select,.field input{width:100%}
.field.check{grid-template-columns:auto 1fr}
.field.check input{width:1.2rem;height:1.2rem}
@media (max-width:560px){.field{grid-template-columns:minmax(0,1fr)}}
.res-summary{font-family:var(--serif);font-size:1.1rem;line-height:1.65;margin-bottom:1.3rem}
.res-nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(10rem,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:1.3rem}
.res-nums div{background:var(--surface);padding:.8rem .9rem}
.res-nums b{display:block;font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
.res-nums .h b{color:var(--gold)}
.res-nums span{font-size:.8rem;color:var(--muted)}
.gauge{margin:0 0 1.5rem}
.gauge-t{position:relative;height:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.gauge-f{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#2c3395,#b15f82,#eb7958,#fbb43d)}
.gauge-m{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--ink)}
.gauge-l{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin-top:.35rem}
.flags{list-style:none;padding:0;margin:0 0 1.4rem}
.flags li{display:grid;grid-template-columns:5.2rem 1fr;gap:.7rem;padding:.55rem 0;border-bottom:1px solid var(--line);font-size:.95rem}
.sev{font-weight:800;font-size:.82rem}
.sev.high{color:var(--warn)}.sev.caution{color:#7A5200}.sev.info{color:var(--muted)}
:root[data-theme="dark"] .sev.caution,.deep .sev.caution{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sev.caution{color:var(--gold)}}
.conditions{font-family:var(--serif);line-height:1.65;padding-left:1.3rem}
.conditions li{margin-bottom:.6rem}
.err{border-left:4px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent);padding:.8rem 1rem;margin-bottom:1rem}
.caveat{font-size:.86rem;color:var(--muted);border-top:1px solid var(--line);padding-top:.9rem}
.compare{display:grid;grid-template-columns:minmax(0,1fr);gap:1rem}
@media (min-width:900px){.compare{grid-template-columns:repeat(3,1fr)}}
.opt{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.2rem}
.opt h3{font-family:var(--display);font-weight:800;font-size:1.7rem}
.opt .bar{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden;margin:.25rem 0 .7rem}
.opt .bar i{display:block;height:100%;background:var(--gold)}
.opt dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:.2rem .8rem;font-size:.92rem}
.opt dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.opt.best{outline:3px solid var(--ok);outline-offset:-3px}

footer.site{background:var(--deep);color:var(--deep-muted);padding:3rem 0 3.5rem;font-size:.92rem}
footer.site .wrap{display:grid;gap:1.5rem}
@media (min-width:900px){footer.site .wrap{grid-template-columns:2fr 1fr 1fr}}
footer.site b{color:var(--deep-ink)}
footer.site a{color:var(--ice);display:inline-flex;align-items:center;min-height:1.75rem;padding:.2rem 0;line-height:1.35}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 1.2rem);transform:translateX(-50%);background:var(--glow);color:#1b1100;font-weight:700;padding:.6rem 1.1rem;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.btn:hover{transform:none}}
@media print{header.site,.hero canvas,nav,.jump,.inst-ctrl{display:none}}
