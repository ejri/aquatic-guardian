name: tracker review
# A policy tracker rots quietly. Once a week, run scripts/tracker_report.py and keep
# the result in one issue titled "Tracker review due" so the list is always current
# and nobody has to wade through a pile of duplicates.
on:
  schedule:
    - cron: "17 6 * * 1"        # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Build the report
        run: |
          {
            python scripts/tracker_report.py
            echo
            echo "_Opened by [tracker review](../../actions/workflows/tracker.yml) on $(date -u +%Y-%m-%d). Re-run it from the Actions tab at any time._"
          } > tracker-report.md
      - name: Open or update the tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const title = "Tracker review due";
            const body = fs.readFileSync("tracker-report.md", "utf8");
            const { owner, repo } = context.repo;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", labels: "tracker", per_page: 100,
            });
            const issue = existing.find(i => i.title === title);
            if (issue) {
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, body });
              core.info(`Updated #${issue.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner, repo, title, body, labels: ["tracker"],
              });
              core.info(`Opened #${created.data.number}`);
            }
