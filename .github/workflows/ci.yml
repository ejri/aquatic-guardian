name: verify
on: [push, pull_request]
jobs:
  screening:
    # Audience site build + package mirrors + briefs + tracker report.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: pip install -e ".[test]"
      - run: python app/build.py --check
      - run: python app/briefs.py --check
      - run: python scripts/tracker_report.py

  plumes2py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e "./python[test]"
      - run: pytest -q
        working-directory: python

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: pip install -e ./python
      - run: node tests/parity.test.mjs

  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r relay/requirements.txt -e ./python
      - run: pytest -q relay/tests

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install playwright pytest && python -m playwright install --with-deps chromium
      - run: python app/build.py --check
      - run: python tests/browser/test_site.py /tmp/shots
      - run: python tests/browser/test_learn.py /tmp/learn-shots
